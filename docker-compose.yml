services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
      POSTGRES_DB: widgets
    ports:
      # Published on 5433 so the project never collides with a Postgres
      # already running on the host's 5432. Inside compose it is still db:5432.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widgets"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Local mail catcher for the confirmation-email side effect.
  # UI on http://localhost:8025 — set SIDE_EFFECT_TRANSPORT=smtp to use it.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://widget:widget@db:5432/widgets
      JWT_SECRET: dev-only-secret-not-for-production
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      DEMO_SITE_ORIGIN: http://localhost:5500
      # Overridable from the shell so the graded probes can be run against the
      # container without editing this file, e.g.
      #   GEO_PROVIDER_A_MODE=down docker compose up -d api
      #   SIDE_EFFECT_TRANSPORT=fail docker compose up -d api
      GEO_PROVIDER_A_MODE: ${GEO_PROVIDER_A_MODE:-live}
      GEO_PROVIDER_B_MODE: ${GEO_PROVIDER_B_MODE:-live}
      SIDE_EFFECT_TRANSPORT: ${SIDE_EFFECT_TRANSPORT:-console}
      RATE_LIMIT_MAX_PER_IP: ${RATE_LIMIT_MAX_PER_IP:-20}
      SPAM_MIN_FILL_MS: ${SPAM_MIN_FILL_MS:-1200}
    ports:
      - "3000:3000"
    volumes:
      # `npm run seed` writes the customer test page with a real widget id baked
      # in. The api container writes it and the site container serves it, so the
      # directory has to be the same directory on both — otherwise seeding
      # succeeds and the demo page never changes.
      - ./public/site:/app/public/site

  # The pretend customer website, on its own port. A different port is a
  # different origin, which is what makes every widget request cross-origin.
  site:
    build: .
    depends_on:
      - api
    environment:
      SITE_PORT: 5500
      # The site server needs no database; these satisfy the config schema.
      DATABASE_URL: postgres://widget:widget@db:5432/widgets
      JWT_SECRET: dev-only-secret-not-for-production
    command: ["npm", "run", "site"]
    volumes:
      - ./public/site:/app/public/site
    ports:
      - "5500:5500"

volumes:
  db_data:
